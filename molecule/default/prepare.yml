---
- name: Prepare Prometheus SSH exporter Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Prometheus SSH exporter Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for Prometheus SSH exporter Molecule tests preparation
      ansible.builtin.package:
        name:
          - python3-requests
        state: present

    # The role's systemd unit bind-mounts the host's `/` into the container with
    # `rslave` propagation. Docker refuses to set that up when `/` is a private
    # mount, which is what it is inside this test container, and the unit then
    # fails to start with "path / is mounted on / but it is not a shared or
    # slave mount".
    #
    # A real host has a shared `/` already, so this only makes the test
    # container look like one. It is not a workaround for anything the role
    # gets wrong on a host it is actually deployed to.
    - name: Ensure / is a shared mount for Prometheus SSH exporter Molecule tests preparation
      ansible.builtin.command:
        argv:
          - mount
          - --make-rshared
          - /
      changed_when: false

    - name: Ensure Docker is installed for Prometheus SSH exporter Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          storage-driver: vfs
